# 外部 LLM 对话解释配置（OpenAI 兼容接口，默认对接智谱 GLM）
#
# 敏感信息（API Key）请勿写入本文件！优先通过环境变量配置：
#   PowerShell:  $env:ZHIPU_API_KEY="你的key"          （当前会话）
#   PowerShell:  [Environment]::SetEnvironmentVariable("ZHIPU_API_KEY","你的key","User")  （永久）
#   CMD:         setx ZHIPU_API_KEY "你的key"
#
# 环境变量优先级高于本文件：ZHIPU_API_KEY(优先)/LLM_API_KEY / LLM_BASE_URL / LLM_MODEL / LLM_TIMEOUT / LLM_TEMPERATURE / LLM_MAX_TOKENS
llm:
  provider: glm                      # 服务商标识（仅作说明，客户端为通用 OpenAI 兼容）
  base_url: https://open.bigmodel.cn/api/paas/v4   # 智谱 GLM OpenAI 兼容地址
  model: glm-4-flash                 # 免费模型（更稳定，减少高峰期 429 限流）；付费可选 glm-4-air / glm-4-plus
  api_key: ""                        # 留空 → 从环境变量 ZHIPU_API_KEY 读取（推荐，避免 key 入库）
  timeout: 60                        # 请求超时（秒）
  temperature: 0.7                   # 采样温度，越低越严谨
  max_tokens: 1024                   # 单次回答最大 token 数
